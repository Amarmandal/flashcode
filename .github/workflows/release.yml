name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: create release
        id: create-release
        uses: actions/github-script@v6
        with:
          script: |
            const ref = context.ref;
            const prefix = 'refs/tags/';
            const tagName = ref.startsWith(prefix) ? ref.slice(prefix.length) : ref;
            
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: `Flash Code ${tagName}`,
              body: 'Take a look at the assets to download and install this app.',
              draft: true,
              prerelease: false,
            });
            return data.id;

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Validate Google OAuth build configuration
        shell: bash
        env:
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          if [[ -z "$VITE_GOOGLE_OAUTH_CLIENT_ID" || "$VITE_GOOGLE_OAUTH_CLIENT_ID" == YOUR_* || "$VITE_GOOGLE_OAUTH_CLIENT_ID" != *.apps.googleusercontent.com ]]; then
            echo "::error::Set the repository variable VITE_GOOGLE_OAUTH_CLIENT_ID to your Google Desktop app client ID."
            exit 1
          fi
          if [[ -z "$GOOGLE_OAUTH_CLIENT_SECRET" || "$GOOGLE_OAUTH_CLIENT_SECRET" == YOUR_* ]]; then
            echo "::error::Set the repository secret GOOGLE_OAUTH_CLIENT_SECRET for the same Google Desktop app client."
            exit 1
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc signing needs no Apple certificate or notarization credentials.
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri]

    steps:
      - name: publish release
        id: publish-release
        uses: actions/github-script@v6
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: false
            })

  update-json:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri, publish-release]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Download and copy latest.json
        uses: actions/github-script@v6
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');

            // Get assets from the release
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id
            });

            // Find the latest.json file
            const latestJsonAsset = assets.find(asset => asset.name === 'latest.json');
            
            if (!latestJsonAsset) {
              throw new Error('latest.json not found in release assets');
            }

            // Download the latest.json content
            const latestJsonResponse = await github.rest.repos.getReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              asset_id: latestJsonAsset.id,
              headers: {
                Accept: 'application/octet-stream'
              }
            });

            // Convert the response to string and write to releases.json
            const latestJsonContent = new TextDecoder().decode(new Uint8Array(latestJsonResponse.data));
            fs.writeFileSync('releases.json', latestJsonContent);
            
            console.log('Successfully copied latest.json to releases.json');

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add releases.json
          git commit -m "Update releases.json for ${{ github.ref_name }}" || exit 0
          git push
