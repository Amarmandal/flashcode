<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101c34" />
    <meta name="description" content="Flashcode helps you learn programming with flashcards and spaced repetition." />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Flashcode</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('mantine-color-scheme');
        document.documentElement.dataset.preloadTheme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.querySelector('meta[name="theme-color"]').setAttribute(
          'content', document.documentElement.dataset.preloadTheme === 'dark' ? '#101c34' : '#f1f5ff'
        );
      } catch (_) {
        document.documentElement.dataset.preloadTheme = 'light';
      }
    </script>
    <style>
      #preload-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 32%, #26345c 0%, #101c34 62%, #0b1427 100%);
        color: #f5f7ff;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .preload-content { display: flex; flex-direction: column; align-items: center; }
      .preload-mark { width: 112px; height: 112px; border-radius: 24px; object-fit: cover; }
      .preload-name { margin-top: 8px; font-size: 28px; font-weight: 750; letter-spacing: -0.055em; }
      .preload-name span { color: #67dbbb; }
      .preload-loading { display: flex; gap: 7px; margin-top: 24px; }
      .preload-loading i { width: 5px; height: 5px; border-radius: 50%; background: #91a4c7; animation: preload-pulse 1.3s ease-in-out infinite; }
      .preload-loading i:nth-child(2) { animation-delay: 0.18s; }
      .preload-loading i:nth-child(3) { animation-delay: 0.36s; }
      [data-preload-theme='light'] #preload-splash {
        background: radial-gradient(circle at 50% 32%, #ffffff 0%, #f1f5ff 68%, #e6ecfa 100%);
        color: #101c34;
      }
      [data-preload-theme='light'] .preload-name span { color: #514bd3; }
      [data-preload-theme='light'] .preload-loading i { background: #737e9c; }
      @keyframes preload-pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      @media (prefers-reduced-motion: reduce) { .preload-loading i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="preload-splash" aria-label="Flashcode is loading">
      <div class="preload-content">
        <img class="preload-mark" src="/brand/flashcode-app-icon.png" alt="" />
        <span class="preload-name">Flash<span>code</span></span>
        <div class="preload-loading" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
